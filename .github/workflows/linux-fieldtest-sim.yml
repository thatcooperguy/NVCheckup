name: Linux field test (simulated GPU)

# GitHub's runners have no NVIDIA GPU, so this job gives the binary a
# simulated one: small shims for nvidia-smi, lspci, lsmod, modinfo, dmesg and
# the DGX OS tooling (.github/fieldtest/shims) answer the exact queries the
# collectors make from a scenario file, and NVC_SIM_ROOT points the collectors
# at a generated /etc, /proc and /sys tree (.github/fieldtest/simroot). That
# runs the GPU-dependent Linux code on real Linux (x86_64 and ARM64): per-GPU
# thermal/PCIe rows for a three-card rig, the analyzer's multi-GPU
# attribution, Xid parsing, the blacklist-nouveau driver gate in dry-run,
# Jetson detection via /etc/nv_tegra_release, and the DGX Spark (GB10)
# unified-memory scenario of docs/roadmap/spark-support.md section 10 plus
# its GSP-failure variant. It is not a substitute for real hardware (see
# issue #2); it is the closest thing we can run on every push.

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'knowledge/**'
      - '.github/fieldtest/**'
      - 'scripts/make-simroot.sh'
      - 'scripts/spark-capture.sh'
      - 'scripts/linux-fieldtest.sh'
      - '.github/workflows/linux-fieldtest-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SHIMS: ${{ github.workspace }}/.github/fieldtest/shims
      NVC_SIM_SCENARIO: ${{ github.workspace }}/.github/fieldtest/scenarios/rig3.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build and prepare shims
        run: |
          set -euo pipefail
          go build -ldflags="-s -w -X github.com/thatcooperguy/nvcheckup/pkg/types.Version=simtest" -o nvcheckup ./cmd/nvcheckup
          chmod +x "$SHIMS"/*
          PATH="$SHIMS:$PATH" nvidia-smi -L
          PATH="$SHIMS:$PATH" nvidia-smi --query-gpu=index,pstate,pcie.link.gen.current --format=csv,noheader,nounits
          PATH="$SHIMS:$PATH" lspci -nn | grep -c NVIDIA

      - name: "Scenario rig3: self-test sees three GPUs"
        run: |
          set -uo pipefail
          export PATH="$SHIMS:$PATH"
          rc=0; ./nvcheckup self-test | tee selftest.txt || rc=$?
          echo "self-test exit=$rc"; [ "$rc" -eq 0 ]
          grep -q "3 GPU(s) detected" selftest.txt

      - name: "Scenario rig3: full run with per-GPU output"
        run: |
          set -uo pipefail
          export PATH="$SHIMS:$PATH"
          mkdir -p rig3
          rc=0; ./nvcheckup run --mode full --json --md --out rig3 || rc=$?
          echo "run exit=$rc"
          # GPU 2 is hot and stuck at Gen1 under load and has an Xid 79, so this must be a WARN or CRIT run, never an internal error.
          [ "$rc" -eq 1 ] || [ "$rc" -eq 2 ]
          echo "--- report.txt ---"; cat rig3/report.txt

      - name: "Scenario rig3: assert findings are attributed to the right GPU"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          j = json.load(open("rig3/report.json", encoding="utf-8"))
          gpus = j["gpus"]
          assert len(gpus) == 3 and all(g["is_nvidia"] for g in gpus), gpus
          assert [t["gpu_index"] for t in j["gpu_thermal"]] == [0, 1, 2], j["gpu_thermal"]
          assert [p["gpu_index"] for p in j["gpu_pcie"]] == [0, 1, 2], j["gpu_pcie"]
          by = {f["id"]: f for f in j["findings"]}
          print("finding ids:", [(f["id"], f["severity"], f.get("gpu_indexes")) for f in j["findings"]])
          for must in ("pcie-downshift", "pcie-idle-power-saving", "gpu-power-cap", "gpu-running-hot", "xid-errors"):
              assert must in by, f"missing finding {must}"
          for never in ("no-nvidia-gpu", "driver-not-detected", "nvidia-smi-missing", "nvidia-module-not-loaded", "jetson-detected", "gpu-clock-slowdown", "thermal-throttling"):
              assert never not in by, f"unexpected finding {never}: {by[never]}"
          assert by["pcie-downshift"]["gpu_indexes"] == [2], by["pcie-downshift"]
          assert by["pcie-idle-power-saving"]["gpu_indexes"] == [0], by["pcie-idle-power-saving"]
          assert by["gpu-power-cap"]["gpu_indexes"] == [1], by["gpu-power-cap"]
          assert by["gpu-power-cap"]["severity"] == "INFO", by["gpu-power-cap"]
          assert by["gpu-running-hot"]["gpu_indexes"] == [2], by["gpu-running-hot"]
          assert by["pcie-downshift"]["severity"] == "WARN", by["pcie-downshift"]
          assert "GPU 2" in by["pcie-downshift"]["evidence"], by["pcie-downshift"]["evidence"]
          xid = by["xid-errors"]["evidence"]
          assert "79" in xid, xid
          for e in j.get("collector_errors") or []:
              assert "panic" not in e["error"].lower(), e
          print("OK: per-GPU attribution is correct")
          PY
          echo "--- report.txt multi-GPU lines ---"
          grep -n "GPUs: 3 NVIDIA" rig3/report.txt
          test "$(grep -c '^\s*PCIe:' rig3/report.txt)" -ge 3
          test "$(grep -c '^\s*Thermal:' rig3/report.txt)" -ge 3
          grep -q "\[GPU 2\]" rig3/report.txt
          grep -q "GPUs: 3 NVIDIA" rig3/report.md
          echo "OK: three per-GPU PCIe and Thermal lines and the multi-GPU summary line are present"

      - name: "Scenario rig3: blacklist-nouveau dry-run passes the driver gate"
        run: |
          set -uo pipefail
          export PATH="$SHIMS:$PATH"
          rc=0; ./nvcheckup fix --id blacklist-nouveau --dry-run --journal ./journal | tee nouveau-dryrun.txt || rc=$?
          echo "dry-run exit=$rc"; [ "$rc" -eq 0 ]
          grep -qi "blacklist nouveau" nouveau-dryrun.txt
          grep -qi "DRY RUN" nouveau-dryrun.txt
          test ! -e ./journal
          echo "OK: driver gate satisfied by the simulated nvidia module; nothing written"

      - name: "Scenario jetson: /etc/nv_tegra_release present, no nvidia-smi"
        run: |
          set -uo pipefail
          # No shims on PATH here: a Jetson has no nvidia-smi at all.
          echo '# R36 (release), REVISION: 4.3, GCID: 38968081, BOARD: generic, EABI: aarch64, DATE: Wed Jan  8 01:49:37 UTC 2025' | sudo tee /etc/nv_tegra_release >/dev/null
          mkdir -p jetson
          rc=0; ./nvcheckup run --mode ai --json --out jetson || rc=$?
          echo "run exit=$rc"; [ "$rc" -ne 3 ]
          sudo rm -f /etc/nv_tegra_release
          python3 - <<'PY'
          import json
          j = json.load(open("jetson/report.json", encoding="utf-8"))
          assert j["system"].get("is_jetson") is True, j["system"]
          assert "R36" in (j["system"].get("jetson_release") or ""), j["system"]
          ids = [f["id"] for f in j["findings"]]
          print("finding ids:", ids)
          assert "jetson-detected" in ids, ids
          for never in ("no-nvidia-gpu", "driver-not-detected", "nvidia-smi-missing", "nvidia-module-not-loaded", "libcuda-not-found"):
              assert never not in ids, f"{never} must be suppressed on Jetson"
          print("OK: Jetson detected and desktop-only findings suppressed")
          PY
          grep -n "Jetson" jetson/report.txt | head -3

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulated-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            rig3/
            jetson/
            selftest.txt
            nouveau-dryrun.txt
          if-no-files-found: warn

  gb10:
    # DGX Spark (GB10) simulation, spec docs/roadmap/spark-support.md section 10.
    # ubuntu-24.04-arm is the primary runner (same CPU architecture as GB10, so
    # runtime.GOARCH == arm64 and the aarch64 code paths are real); ubuntu-24.04
    # (amd64) runs the same scenario to prove the detection does not depend on
    # the host architecture. The shims answer every command; NVC_SIM_ROOT points
    # the collectors at the generated /etc, /proc and /sys tree.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SHIMS: ${{ github.workspace }}/.github/fieldtest/shims
      SIMROOT: ${{ github.workspace }}/.github/fieldtest/simroot
      SCENARIOS: ${{ github.workspace }}/.github/fieldtest/scenarios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build, prepare shims, regenerate simroot
        run: |
          set -euo pipefail
          go build -ldflags="-s -w -X github.com/thatcooperguy/nvcheckup/pkg/types.Version=simtest" -o nvcheckup ./cmd/nvcheckup
          chmod +x "$SHIMS"/* scripts/*.sh
          for f in "$SHIMS"/*; do
            case "$f" in *nvidia-smi|*nvc-sim-scenario) python3 -m py_compile "$f" ;; *.sh) bash -n "$f" ;; *) bash -n "$f" ;; esac
          done
          for s in "$SCENARIOS"/*.json; do python3 -m json.tool "$s" >/dev/null; done
          # Capture-kit redaction rules (spec 12): whole-token IPv6, version-safe IPv4, serial / GUID / MAC / host / user.
          scripts/spark-capture.sh --self-test
          # The committed simroot trees must match what the scenarios generate (also creates the empty dirs).
          scripts/make-simroot.sh --all
          git status --porcelain -- .github/fieldtest/simroot
          test -z "$(git status --porcelain -- .github/fieldtest/simroot)" || { echo "simroot is stale: run scripts/make-simroot.sh --all and commit"; exit 1; }

      - name: "Scenario gb10: shims answer the spec's exact strings"
        env:
          NVC_SIM_SCENARIO: ${{ github.workspace }}/.github/fieldtest/scenarios/gb10.json
        run: |
          set -euo pipefail
          export PATH="$SHIMS:$PATH"
          # spec 2.1: name "NVIDIA GB10", memory.* print "[N/A]", table shows "Not Supported", compute_cap 12.1, PCIe misreported GEN 1@1x
          nvidia-smi -L | tee /dev/stderr | grep -q "NVIDIA GB10"
          nvidia-smi --query-gpu=memory.total,memory.used,memory.free --format=csv,noheader,nounits | tee /dev/stderr | grep -qx '\[N/A\], \[N/A\], \[N/A\]'
          nvidia-smi --query-gpu=index,compute_cap --format=csv,noheader | tee /dev/stderr | grep -qx '0, 12.1'
          nvidia-smi --query-gpu=index,pcie.link.gen.current,pcie.link.width.current --format=csv,noheader,nounits | grep -qx '0, 1, 1'
          nvidia-smi | tee /dev/stderr | grep -q "Not Supported"
          nvidia-smi -q -d PERFORMANCE | grep -q "Clocks Event Reasons"
          # A rejected field prints the real error on stdout and exits 2 (self-test relies on this).
          bad="$(nvidia-smi --query-gpu=index,does.not.exist --format=csv,noheader || true)"
          test "$bad" = 'Field "does.not.exist" is not a valid field to query.'
          # spec 3.1 row 5: lspci [10de:2e12] at 000f:01:00.0; 2.1: four ConnectX-7 functions [15b3:1021]
          lspci -nn | grep -q '^000f:01:00.0 .*\[10de:2e12\]'
          test "$(lspci -nn -d 15b3: | grep -c 1021)" -eq 4
          # spec 3.1 row 10: DMI strings of a Founders Edition
          test "$(dmidecode -s system-manufacturer)" = "NVIDIA"
          test "$(dmidecode -s system-product-name)" = "NVIDIA_DGX_Spark"
          test "$(dmidecode -s system-version)" = "A.7"
          # spec 3.2 packages; 2.1 OTA checker and fwupdmgr
          dpkg-query -W -f='${Package} ${Version}\n' nvidia-driver-580-open | grep -q '580.159.03'
          nvidia-spark-ota-check summary | grep -q 'detected_ota OTA2607'
          fwupdmgr get-devices | grep -q 'Current version'
          # fwupdmgr get-upgrades with nothing pending exits 2 (tool behaviour placeholder); the collector parses stdout regardless.
          rc=0; fwupdmgr get-upgrades --no-unreported-check --no-metadata-check --no-remote-check --no-device-prompt >/dev/null || rc=$?; [ "$rc" -eq 2 ]
          systemctl is-active dgx-dashboard.service | grep -qx active
          # dgxos_host.go tells an installed-but-stopped unit from a missing one with LoadState; a stock unit has no gb10-clock-cap.service (S48 add-on).
          test "$(systemctl show -p LoadState --value dgx-dashboard.service)" = "loaded"
          test "$(systemctl show -p LoadState --value gb10-clock-cap.service)" = "not-found"
          ibdev2netdev | grep -q 'rocep1s0f0 port 1 ==> enp1s0f0np0'
          ip -4 -o addr show | grep -q 'enp1s0f0np0 .*inet 192.168.100.10/24'
          ip route show default | grep -q '^default via .* dev enP7s7'
          uname -r | grep -qx '6.17.0-1026-nvidia'
          # spec 5 gb10-logless-hard-poweroff: the previous boot ends with a clean-shutdown marker; kernel lines come from the scenario, not the runner.
          journalctl --list-boots --no-pager -q | grep -q '^ *-1 '
          journalctl -b -1 --no-pager -q -o cat -n 30 | tail -1 | grep -qx 'Journal stopped'
          journalctl -k -b --no-pager -q -o cat | grep -q 'NVRM: loading NVIDIA Open GPU Kernel Module for aarch64  580.159.03'
          test -z "$(journalctl -u avahi-daemon.service -b --no-pager -q -g 'Host name conflict')"
          # ldconfig -p lists the driver libraries linux.go / cx7.go look up; the real ldconfig would rebuild the cache and is never called.
          ldconfig -p | grep -q 'libcuda.so.1 .*=> /usr/lib/aarch64-linux-gnu/libcuda.so.1'
          # spec 2.1: no per-process memory on unified memory; the compute-apps query answers an empty list, not an error.
          test -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader)"
          nvidia-smi -q -d PERFORMANCE | grep -q 'Clocks Event Reasons Counters'
          # NVC_SIM_ROOT files
          grep -q 'DGX_NAME="DGX Spark"' "$SIMROOT/gb10/etc/dgx-release"
          grep -q '^MemTotal: *125513944 kB' "$SIMROOT/gb10/proc/meminfo"
          grep -qx '6.17.0-1026-nvidia' "$SIMROOT/gb10/proc/sys/kernel/osrelease"
          grep -q '^pswpin 0' "$SIMROOT/gb10/proc/vmstat"
          grep -qx 'acpitz' "$SIMROOT/gb10/sys/class/thermal/thermal_zone0/type"
          test -d "$SIMROOT/gb10/sys/fs/pstore" && test -z "$(ls -A "$SIMROOT/gb10/sys/fs/pstore")"
          grep -q 'mtu: 9000' "$SIMROOT/gb10/etc/netplan/50-cx7.yaml"
          grep -qx 'ENABLED=no' "$SIMROOT/gb10/etc/ufw/ufw.conf"
          test -f "$SIMROOT/gb10/etc/nvidia/cx7-hotplug-enabled"
          grep -q '"nvidia"' "$SIMROOT/gb10/etc/docker/daemon.json" && test -f "$SIMROOT/gb10/etc/cdi/nvidia.yaml"
          grep -q '^deb ' "$SIMROOT/gb10/etc/apt/sources.list.d/nvidia-container-toolkit.list"
          grep -qx '0x15b3' "$SIMROOT/gb10/sys/class/net/enp1s0f0np0/device/vendor"
          grep -q 'PCI_SLOT_NAME=0002:01:00.0' "$SIMROOT/gb10/sys/class/infiniband/roceP2p1s0f0/device/uevent"
          test -d "$SIMROOT/gb10/sys/class/infiniband/roceP2p1s0f0/device/net/enP2p1s0f0np0"
          echo "OK: shims and simroot answer the spec's strings"

      - name: "Scenario gb10: self-test sees the GB10"
        env:
          NVC_SIM_SCENARIO: ${{ github.workspace }}/.github/fieldtest/scenarios/gb10.json
          NVC_SIM_ROOT: ${{ github.workspace }}/.github/fieldtest/simroot/gb10
        run: |
          set -uo pipefail
          export PATH="$SHIMS:$PATH"
          rc=0; ./nvcheckup self-test | tee gb10-selftest.txt || rc=$?
          echo "self-test exit=$rc"
          # 1 (warnings) is allowed: a runner has no torch / CUDA toolkit. 2 or 3 is a failure.
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]
          grep -q "1 GPU(s) detected" gb10-selftest.txt
          # spec 4: the compute_cap query is part of self-test (WP1-dependent: passes trivially until it is added).
          grep -i "compute_cap\|compute capability" gb10-selftest.txt || echo "::notice::self-test does not report the compute_cap query yet (WP1)"

      - name: "Scenario gb10: run --mode full"
        env:
          NVC_SIM_SCENARIO: ${{ github.workspace }}/.github/fieldtest/scenarios/gb10.json
          NVC_SIM_ROOT: ${{ github.workspace }}/.github/fieldtest/simroot/gb10
        run: |
          set -uo pipefail
          export PATH="$SHIMS:$PATH"
          mkdir -p gb10
          rc=0; ./nvcheckup run --mode full --json --md --out gb10 || rc=$?
          echo "run exit=$rc"
          # spec 10: a healthy DGX Spark exits 0 or 1 (INFO findings, at most WARN noise), never 2 or 3.
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]
          echo "--- report.txt ---"; cat gb10/report.txt

      - name: "Scenario gb10: assert platform, unified memory and findings (spec 10)"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          j = json.load(open("gb10/report.json", encoding="utf-8"))
          by = {f["id"]: f for f in j["findings"]}
          print("finding ids:", [(f["id"], f["severity"], f.get("impact")) for f in j["findings"]])
          # --- platform (WP1: common.DetectPlatform + ApplyPlatformFlags) ---
          plat = j.get("platform") or {}
          print("platform:", {k: plat.get(k) for k in ("class", "vendor", "model", "product_version", "bios_version", "gpu_soc", "compute_cap", "unified_memory", "nvidia_kernel_flavour")})
          assert plat.get("class") == "dgx-spark", plat                       # spec 3.1 rows 4/5
          assert plat.get("unified_memory") is True, plat                      # spec 3.1 flag rule A
          assert plat.get("vendor") in (None, "", "NVIDIA"), plat              # spec 3.1 row 10 (DMI)
          # --- GPU (WP1) ---
          gpus = j["gpus"]
          assert len(gpus) == 1 and gpus[0]["is_nvidia"], gpus
          assert "GB10" in gpus[0]["name"], gpus[0]                            # spec 2.1
          assert gpus[0].get("memory_reporting") == "not-supported", gpus[0]   # spec 3.1 flag rule B
          assert gpus[0].get("on_package") is True, gpus[0]                    # spec 3.1 flag rules A/B
          assert gpus[0].get("compute_cap") in (None, "12.1"), gpus[0]         # spec 2.1 (None until the tolerant query lands)
          for k, v in gpus[0].items():
              if k.startswith("memory") and k != "memory_reporting":
                  assert not (isinstance(v, (int, float)) and v > 0), (k, v)  # nvidia-smi memory is [N/A]: never a number
          pcie = j.get("gpu_pcie") or []
          assert pcie and pcie[0].get("on_package") is True, pcie             # spec 5.1: GEN 1@1x must not reach pcie-width-reduced
          pc = j.get("pcie")
          assert pc is None or pc.get("on_package") is True, pc            # spec 10: pcie.on_package (None tolerated until the pointer is guaranteed on single-GPU reports)
          # --- unified memory (WP1: unified_memory.go from NVC_SIM_ROOT/proc/meminfo) ---
          um = j.get("unified_memory")
          assert um, "unified_memory section missing"
          assert um.get("mem_total_kb") == 125513944, um                       # spec 2.1 / 10
          assert um.get("mem_available_kb") == 121519624, um                   # scenario meminfo
          assert um.get("allocatable_kb") == 121519624 + 16777212, um          # spec 3.3: MemAvailable + SwapFree, no hugepages
          # --- findings (WP2) ---
          for must in ("dgx-spark-detected", "unified-memory-nvsmi-expected"):
              assert must in by, f"missing finding {must}"                    # spec 10
          assert by["dgx-spark-detected"]["severity"] == "INFO", by["dgx-spark-detected"]
          forbidden = ("low-vram", "fan-not-spinning", "gpu-power-cap", "gpu-clock-slowdown", "no-nvidia-gpu",
                       "driver-not-detected", "nvidia-smi-missing", "jetson-detected", "dgx-spark-gsp-init-failure",
                       "dgx-spark-ota-torn", "dgx-spark-foreign-driver-packages", "cx7-not-enumerated",
                       "unified-memory-swap-in-use", "gb10-logless-hard-poweroff", "dgx-spark-non-nvidia-kernel",
                       "dgx-spark-ota-outdated", "dgx-spark-driver-too-old", "rtx-spark-linux-unsupported")
          for never in forbidden:
              assert never not in by, f"unexpected finding {never}: {by[never]}"   # spec 10 and 5.1
          for i in by:
              assert not i.startswith("pcie-"), f"PCIe rule fired on an on-package GPU: {by[i]}"  # spec 5.1
          for f in j["findings"]:
              assert f.get("impact"), f"finding without impact: {f}"          # spec 5 / 10
              assert f["impact"] in ("none", "reversible", "persistent", "irreversible", "data-loss"), f
          for e in j.get("collector_errors") or []:
              text = e["error"].lower()
              assert "panic" not in text and "runtime error" not in text, e
              print("collector note:", e["collector"], "->", e["error"][:120])
          # --- DGX OS (integration: linux.CollectDGXOS wired into phase 4; pkg/types DGXOSInfo.UnitsQueried contract) ---
          dgx = j.get("dgx_os")
          assert dgx, "dgx_os section missing (CollectDGXOS not wired)"
          print("dgx_os:", {k: dgx.get(k) for k in ("ota_version", "ota_name", "ota_torn", "driver_pkg_version", "firmware_pkg_version", "modules_for_kernel", "units_queried", "dashboard_active", "dashboard_admin_active", "fwupd_active", "dashboard_port_open", "fwupd_error")})
          assert dgx.get("units_queried") is True, dgx                          # systemctl (shim) answered: the *_active booleans are measurements
          assert dgx.get("dashboard_active") is True and dgx.get("dashboard_admin_active") is True and dgx.get("fwupd_active") is True, dgx
          assert dgx.get("dashboard_port_open") is True, dgx                    # /proc/net/tcp LISTEN on 11000 from the simroot
          assert not dgx.get("fwupd_error"), dgx
          assert "dgx-spark-dashboard-unhealthy" not in by, by.get("dgx-spark-dashboard-unhealthy")   # healthy units must not be reported unhealthy
          # ota_torn stays None until parseTornScore accepts the S12 JSON shape {"torn": N} that the shim
          # prints verbatim (spec 2.1); today it only parses a labelled `torn-score: N` or a bare integer.
          assert dgx.get("ota_name") == "OTA2607" and dgx.get("ota_torn") in (None, 0) and not dgx.get("ota_failed"), dgx   # spec 2.1 / scenario
          assert dgx.get("modules_for_kernel") is True, dgx                     # spec 3.2 linux-modules-nvidia-580-open-<kernel> present
          assert dgx.get("driver_pkg_version", "").startswith("580.159.03"), dgx
          assert "serial_number" not in dgx or dgx["serial_number"] in ("", "<serial>"), dgx
          # --- host state from journalctl / pstore / thermal fixtures (linux.CollectDGXHostState) ---
          assert plat.get("prev_boot_clean") is True, plat                      # journalctl shim: previous boot ends with "Journal stopped"
          assert not plat.get("unclean_boots"), plat
          assert plat.get("pstore_empty") is True, plat
          assert not plat.get("clock_cap_unit"), plat                           # a stock unit has no gb10-clock-cap.service
          assert "gb10-clock-cap-active" not in by and "dgx-spark-suspend-failure" not in by, by.keys()
          fw = {c["name"]: c for c in plat.get("firmware") or []}
          assert set(fw) == {"Embedded Controller", "UEFI Device Firmware", "USB Power Delivery Controller"}, fw   # fwupdmgr shim (names are placeholders)
          assert fw["Embedded Controller"].get("version") == "3.5.8", fw       # hex 0x03000508 decoded (ASSUMPTION marked in dgxos_host.go; spec rule dgx-spark-firmware-behind)
          assert "dgx-spark-firmware-behind" not in by, by.get("dgx-spark-firmware-behind")
          # --- ConnectX-7 (integration: linux.CollectCluster wired into phase 4; spec 9) ---
          cl = j.get("cluster")
          assert cl and cl.get("ports"), "cluster section missing (CollectCluster not wired or no 15b3 functions seen)"
          ports = cl["ports"]
          print("cluster ports:", [(p.get("netdev"), p.get("rdma_dev"), p.get("pci_addr"), p.get("cage"), p.get("state"), p.get("speed_mbps"), p.get("mtu"), p.get("ipv4")) for p in ports])
          assert len(ports) == 4, ports                                          # four 15b3 functions, two per cage
          active = [p for p in ports if "ACTIVE" in (p.get("state") or "")]
          assert len(active) == 2, ports                                         # exactly the two cabled twins are ACTIVE
          assert {p["cage"] for p in active} == {0}, active                      # ... and they form one cage (function .0 of domains 0000 and 0002)
          assert {p["cage"] for p in ports} == {0, 1}, ports
          for p in active:
              assert p.get("speed_mbps") == 200000 and p.get("mtu") == 9000, p   # spec 9 healthy link
              # Contract for internal/redact.redactCluster: cx7.go stores CIDRs ("192.168.100.10/24"),
              # so the address part must be redacted and the "/24" prefix re-appended (RedactIP alone
              # returns a CIDR unchanged because net.ParseIP rejects it). Fails until that lands.
              assert p.get("ipv4") and all(a.endswith("/24") for a in p["ipv4"]), p   # addresses redacted, prefix kept
              assert not any("192.168.10" in a for a in p["ipv4"]), p            # ... and really redacted
          assert cl.get("hotplug_file_enabled") is True and cl.get("ufw_enabled") is False and cl.get("avahi_active") is True, cl
          for never in ("cx7-twin-link-mismatch", "cx7-link-speed-degraded", "cx7-up-no-ip", "cx7-twins-same-subnet", "cx7-mtu-mismatch",
                        "nccl-env-misconfigured", "cx7-mdns-hostname-conflict", "cx7-firewall-blocks-cluster"):
              assert never not in by, f"unexpected finding {never}: {by[never]}"   # spec 9 healthy cluster
          # --- ecosystem (ai.CollectEcosystem; a runner has docker without the nvidia runtime and python3 without torch) ---
          eco = j.get("ecosystem")
          if eco is None:
              print("ecosystem: absent on this runner (tolerated)")
          else:
              assert isinstance(eco, dict), eco
              print("ecosystem:", {k: eco.get(k) for k in ("torch_arch_list", "docker_runtimes", "docker_cdi", "cdi_spec_present", "snap_docker", "listening_ports")})
              assert 11000 in (eco.get("listening_ports") or []), eco           # /proc/net/tcp from the simroot, not the runner
          print("OK: GB10 platform, unified memory, DGX OS, cluster and findings match spec section 10")
          PY
          echo "--- summary lines ---"
          # spec 5.1 / 10: the summary block replaces VRAM with a unified-memory line and adds a Platform line.
          grep -n "Unified memory" gb10/report.txt
          grep -n "Platform: DGX Spark" gb10/report.txt
          # `! grep` is exempt from set -e, so test explicitly and fail the step (spec 5.1: no VRAM line on unified memory).
          if grep -q "^\s*VRAM:" gb10/report.txt; then
            echo "VRAM line present on a unified-memory platform (spec 5.1)"
            grep -n "^\s*VRAM:" gb10/report.txt
            exit 1
          fi
          grep -q "Unified memory" gb10/report.md
          # spec 3.1 row 4: DGX_SERIAL_NUMBER is redacted (WP1).
          for f in gb10/report.txt gb10/report.json gb10/report.md; do
            if grep -qF "1234567890123" "$f"; then echo "DGX serial number leaked in $f"; exit 1; fi
            if grep -qF -- "$(hostname)" "$f"; then echo "hostname leaked in $f"; exit 1; fi
            # The journalctl shim prints the scenario's DGX OS default hostname (spark-0f01) in its short format;
            # redact maps the spark-xxxx form to <host> (ASSUMPTION documented in internal/redact).
            if grep -qF "spark-0f01" "$f"; then echo "DGX OS default hostname leaked in $f"; exit 1; fi
            # Fabric addresses are LAN ranges and must leave as <lan-ip>/24.
            if grep -qE '192\.168\.10[01]\.10' "$f"; then echo "fabric IPv4 leaked in $f"; exit 1; fi
          done
          echo "OK: summary lines present, serial, hostnames and fabric addresses redacted"

      - name: "Scenario gb10: snapshot"
        env:
          NVC_SIM_SCENARIO: ${{ github.workspace }}/.github/fieldtest/scenarios/gb10.json
          NVC_SIM_ROOT: ${{ github.workspace }}/.github/fieldtest/simroot/gb10
        run: |
          set -euo pipefail
          export PATH="$SHIMS:$PATH"
          mkdir -p gb10-snap
          ./nvcheckup snapshot --out gb10-snap
          a="$(ls gb10-snap/nvcheckup-snapshot-*.json | head -1)"
          python3 - "$a" <<'PY'
          import json, sys
          j = json.load(open(sys.argv[1], encoding="utf-8"))
          gpus = j.get("gpus") or []
          assert gpus and "GB10" in gpus[0]["name"], gpus
          print("snapshot gpus:", [(g["name"], g.get("memory_reporting")) for g in gpus])
          PY
          if grep -qF -- "$(hostname)" "$a"; then echo "hostname leaked in snapshot"; exit 1; fi
          ./nvcheckup compare --md --out gb10-snap "$a" "$a"
          test -s gb10-snap/comparison.md
          echo "OK: snapshot/compare on GB10"

      - name: "Scenario gb10: llm-plan from the saved report (spec 7)"
        # `nvcheckup llm-plan --report FILE` plans offline from report.json: the
        # pool is the report's unified_memory.mem_total_kb (119.7 GiB, never "128
        # GB"). The first worked example of spec 7.5 (Llama 3.1 8B, default BF16
        # weights, agent profile = 4 streams x 32K, vLLM) must come out at W 15.0
        # + KV 16.0 + R 12 + F 8 = 51.0 GiB and --gpu-memory-utilization 0.40. The
        # guard only skips (with a notice) when the binary has no llm-plan
        # subcommand at all (WP3 is on main, so this should never trigger); a wrong
        # answer fails the job.
        env:
          NVC_SIM_SCENARIO: ${{ github.workspace }}/.github/fieldtest/scenarios/gb10.json
          NVC_SIM_ROOT: ${{ github.workspace }}/.github/fieldtest/simroot/gb10
        run: |
          set -uo pipefail
          export PATH="$SHIMS:$PATH"
          if ! ./nvcheckup help 2>&1 | grep -q "llm-plan"; then
            echo "::notice::llm-plan is not in this build (unexpected: WP3 is on main); skipping"
            exit 0
          fi
          test -s gb10/report.json
          mkdir -p gb10-plan
          ./nvcheckup llm-plan --list-models | tee gb10-plan/models.txt | grep -q 'llama-3.1-8b-instruct'
          # spec 7.1 flags as implemented: --report FILE --model ID --profile agent --runtime vllm --json --out DIR
          rc=0; ./nvcheckup llm-plan --report gb10/report.json --model llama-3.1-8b-instruct --profile agent --runtime vllm --json --out gb10-plan | tee gb10-plan/stdout.txt || rc=$?
          echo "llm-plan exit=$rc"
          # spec 7.1: 0 fits, 1 fits with warnings, 2 does not fit, 3 error. 51.0 GiB fits a 119.7 GiB pool.
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]
          test -s gb10-plan/plan.json
          test -s gb10-plan/plan.txt
          grep -q "119.7" gb10-plan/plan.txt                            # spec 7.4: pool = measured MemTotal
          if grep -q "128 GB" gb10-plan/plan.txt; then echo "plan.txt assumes 128 GB (spec 7.9)"; exit 1; fi
          python3 - <<'PY'
          import json
          p = json.load(open("gb10-plan/plan.json", encoding="utf-8"))
          fit = p.get("fit") or {}
          print("fit:", fit)
          print("memory:", p.get("memory"))
          assert abs(float(fit["total_gib"]) - 51.0) < 0.05, fit                   # spec 7.5: W 15.0 + KV 16.0 + R 12 + F 8
          assert abs(float(fit["gpu_memory_utilization"]) - 0.40) < 0.001, fit    # spec 7.5: ceil05(43.0 / 119.7) = 0.40
          assert "128" not in json.dumps(p.get("memory")), p.get("memory")      # spec 7.9: never assume "128 GB"
          PY
          echo "OK: llm-plan planned offline from report.json with the spec 7.5 numbers"

      - name: "Scenario gb10-gsp-fail: GSP init failure is a CRIT, not 'no GPU' (spec 10)"
        env:
          NVC_SIM_SCENARIO: ${{ github.workspace }}/.github/fieldtest/scenarios/gb10-gsp-fail.json
          NVC_SIM_ROOT: ${{ github.workspace }}/.github/fieldtest/simroot/gb10-gsp-fail
        run: |
          set -uo pipefail
          export PATH="$SHIMS:$PATH"
          # spec 3.2: nvidia-smi says "No devices were found"; dmesg carries the SEC2 / GSP lines; lspci still shows 10de:2e12.
          # The shim exits non-zero by design; under GitHub's default `bash -e` an unguarded call would abort the step
          # before ./nvcheckup runs, so capture the code and assert the failure instead of tolerating it.
          rc=0; nvidia-smi -L || rc=$?; echo "nvidia-smi exit=$rc"; [ "$rc" -ne 0 ]
          dmesg | grep -c "GSP\|SEC2"
          mkdir -p gb10-gsp-fail
          rc=0; ./nvcheckup run --mode full --json --md --out gb10-gsp-fail || rc=$?
          echo "run exit=$rc"
          # A CRIT finding means exit 2 by the documented exit codes; 3 would be an internal error.
          [ "$rc" -eq 2 ]
          echo "--- report.txt ---"; cat gb10-gsp-fail/report.txt
          python3 - <<'PY'
          import json
          j = json.load(open("gb10-gsp-fail/report.json", encoding="utf-8"))
          by = {f["id"]: f for f in j["findings"]}
          print("finding ids:", [(f["id"], f["severity"]) for f in j["findings"]])
          plat = j.get("platform") or {}
          assert plat.get("class") == "dgx-spark", plat                          # spec 3.1 row 4 (dgx-release) and row 5 (lspci 10de:2e12)
          assert "dgx-spark-gsp-init-failure" in by, "missing dgx-spark-gsp-init-failure (WP2)"   # spec 10
          f = by["dgx-spark-gsp-init-failure"]
          assert f["severity"] == "CRIT", f
          assert f.get("impact"), f
          for never in ("no-nvidia-gpu", "driver-not-detected"):               # spec 10 and 5.1
              assert never not in by, f"{never} must not fire when dgx-spark-gsp-init-failure does: {by[never]}"
          assert "jetson-detected" not in by, by.keys()
          # spec 3.2: the OTA checker reports failed: ["driver"] and torn 1; dgx-spark-ota-torn may fire, it is not forbidden here.
          dgx = j.get("dgx_os") or {}
          print("dgx_os:", {k: dgx.get(k) for k in ("ota_name", "ota_torn", "ota_failed", "units_queried")})
          assert dgx.get("units_queried") is True, dgx
          assert "driver" in (dgx.get("ota_failed") or []), dgx
          # spec 3.2: the SEC2 / GSP lines reach the analyzer verbatim (LinuxInfo.GSPFailureLines) and no PCI-domain digit is lost.
          lines = " ".join((j.get("linux") or {}).get("gsp_failure_lines") or [])
          assert "ksec2PrepareBootCommands_GB20B" in lines and "RmInitAdapter failed! (0x62:0x65:2028)" in lines, lines
          for e in j.get("collector_errors") or []:
              assert "panic" not in e["error"].lower(), e
          print("OK: GSP failure classified as dgx-spark-gsp-init-failure CRIT")
          PY
          for f in gb10-gsp-fail/report.txt gb10-gsp-fail/report.json gb10-gsp-fail/report.md; do
            if grep -qF "1234567890123" "$f"; then echo "DGX serial number leaked in $f"; exit 1; fi
            if grep -qF -- "$(hostname)" "$f"; then echo "hostname leaked in $f"; exit 1; fi
          done

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb10-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            gb10/
            gb10-snap/
            gb10-plan/
            gb10-gsp-fail/
            gb10-selftest.txt
          if-no-files-found: warn

      - name: publish sample report for the docs (WP5)
        # examples/sample-report-dgx-spark.txt is produced from this artifact (spec section 11).
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: sample-report-dgx-spark
          path: gb10/report.txt
          if-no-files-found: warn
