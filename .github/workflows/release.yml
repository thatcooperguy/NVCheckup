name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job needs to write (to publish the GitHub Release).
permissions:
  contents: read

jobs:
  test:
    # A tag is released only from a commit that passes vet and the test suite.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Vet and test
        run: go vet ./... && go test ./... -timeout 120s

  changelog:
    # Refuse to publish a version that has no CHANGELOG entry.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CHANGELOG.md mentions this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' entry. Add one before tagging."
            exit 1
          fi
          echo "CHANGELOG.md has an entry for ${version}."

  build:
    needs: [test, changelog]
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            name: nvcheckup-windows-amd64.exe
          - goos: linux
            goarch: amd64
            ext: ''
            name: nvcheckup-linux-amd64
          - goos: linux
            goarch: arm64
            ext: ''
            name: nvcheckup-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # Bake the tag (minus the leading "v") into types.Version so `nvcheckup version` matches the release.
          go build -ldflags="-s -w -X github.com/thatcooperguy/nvcheckup/pkg/types.Version=${GITHUB_REF_NAME#v}" -o dist/${{ matrix.name }} ./cmd/nvcheckup

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}
            dist/${{ matrix.name }}.sha256

  release:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          body: |
            ## NVCheckup ${{ github.ref_name }}

            Cross-platform NVIDIA diagnostic tool. See `CHANGELOG.md` for what changed.

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Windows | x86_64 | `nvcheckup-windows-amd64.exe` |
            | Linux | x86_64 | `nvcheckup-linux-amd64` |
            | Linux | ARM64 | `nvcheckup-linux-arm64` |

            ### Verify Downloads

            Each binary has a corresponding `.sha256` checksum file. Verify before running.

            ```bash
            # Linux
            sha256sum -c nvcheckup-linux-amd64.sha256
            ```

            ```powershell
            # Windows: compare the printed hash with the contents of the .sha256 file
            certutil -hashfile nvcheckup-windows-amd64.exe SHA256
            Get-Content nvcheckup-windows-amd64.exe.sha256
            ```

            ### Windows SmartScreen

            The Windows binary is **not code-signed**, so SmartScreen may show "Windows protected your PC".
            After verifying the SHA256 above, click **More info** and then **Run anyway**. If you would
            rather not, build from source: `go install github.com/thatcooperguy/nvcheckup/cmd/nvcheckup@${{ github.ref_name }}`.

            ### Quick Start

            ```bash
            # Linux
            chmod +x nvcheckup-linux-amd64
            ./nvcheckup-linux-amd64 run --mode full --zip

            # Windows
            nvcheckup-windows-amd64.exe run --mode full --zip
            ```

            `run` is read-only and makes no network calls unless you add `--network`.
            Fixes are applied only by `nvcheckup fix --id <id>` after you confirm, and can be reversed with `nvcheckup undo`.

            ---
            *Unofficial community tool, not affiliated with NVIDIA Corporation.*
