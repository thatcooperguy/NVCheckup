<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="NVCheckup: cross-platform NVIDIA diagnostics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1015"/>
      <stop offset="1" stop-color="#121a22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#76b900" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2731"/>
      <stop offset="1" stop-color="#0f161d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <!-- soft green glow behind the wordmark -->
    <ellipse cx="260" cy="150" rx="420" ry="170" fill="#76b900" fill-opacity="0.06"/>
    <!-- top accent line -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#glow)"/>

    <!-- wordmark -->
    <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
      <rect x="64" y="76" width="6" height="64" rx="3" fill="#76b900"/>
      <text x="88" y="128" font-size="64" font-weight="800" fill="#f3f6f8" letter-spacing="-1.5">NV<tspan fill="#76b900">Checkup</tspan></text>
      <text x="90" y="166" font-size="21" font-weight="500" fill="#a9b6c2">Cross-platform NVIDIA diagnostics</text>
      <text x="90" y="192" font-size="21" font-weight="500" fill="#a9b6c2">for gamers, AI developers, and creators.</text>
      <text x="90" y="218" font-size="15" font-style="italic" fill="#6f7f8d">For when nvidia-smi and PyTorch disagree about whether you own a GPU.</text>

      <!-- pills -->
      <g font-size="13" font-weight="600">
        <rect x="90" y="240" width="150" height="28" rx="14" fill="#76b900" fill-opacity="0.14" stroke="#76b900" stroke-opacity="0.5"/>
        <text x="165" y="259" text-anchor="middle" fill="#b8e35a">Read-only by default</text>
        <rect x="250" y="240" width="118" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="309" y="259" text-anchor="middle" fill="#c9d3dc">Redacted output</text>
        <rect x="378" y="240" width="196" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="476" y="259" text-anchor="middle" fill="#c9d3dc">Windows  ·  Linux  ·  ARM64</text>
        <rect x="584" y="240" width="132" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="650" y="259" text-anchor="middle" fill="#c9d3dc">Zero dependencies</text>
      </g>
    </g>

    <!-- stylised GPU card, right side -->
    <g transform="translate(790 62)">
      <rect x="0" y="0" width="346" height="150" rx="14" fill="url(#card)" stroke="#2c3a47" stroke-width="1.5"/>
      <!-- PCIe edge connector -->
      <rect x="40" y="150" width="200" height="14" rx="2" fill="#8a7a2a" fill-opacity="0.9"/>
      <g fill="#0b1015">
        <rect x="52" y="152" width="6" height="10"/><rect x="66" y="152" width="6" height="10"/><rect x="80" y="152" width="6" height="10"/>
        <rect x="94" y="152" width="6" height="10"/><rect x="108" y="152" width="6" height="10"/><rect x="122" y="152" width="6" height="10"/>
        <rect x="136" y="152" width="6" height="10"/><rect x="150" y="152" width="6" height="10"/><rect x="164" y="152" width="6" height="10"/>
        <rect x="178" y="152" width="6" height="10"/><rect x="192" y="152" width="6" height="10"/><rect x="206" y="152" width="6" height="10"/><rect x="220" y="152" width="6" height="10"/>
      </g>
      <!-- fans -->
      <g stroke="#3a4a58" stroke-width="2" fill="#0b1015">
        <circle cx="78" cy="75" r="46"/>
        <circle cx="200" cy="75" r="46"/>
      </g>
      <g fill="none" stroke="#5a6d7c" stroke-width="3" stroke-linecap="round">
        <path d="M78 75 l0 -34 M78 75 l30 17 M78 75 l-30 17"/>
        <path d="M200 75 l0 -34 M200 75 l30 17 M200 75 l-30 17"/>
      </g>
      <circle cx="78" cy="75" r="9" fill="#76b900"/>
      <circle cx="200" cy="75" r="9" fill="#76b900"/>
      <!-- status readout -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
        <rect x="262" y="24" width="68" height="102" rx="8" fill="#0b1015" stroke="#2c3a47"/>
        <text x="296" y="46" text-anchor="middle" fill="#76b900" font-weight="700">OK</text>
        <text x="296" y="66" text-anchor="middle" fill="#a9b6c2">42°C</text>
        <text x="296" y="84" text-anchor="middle" fill="#a9b6c2">P8</text>
        <text x="296" y="102" text-anchor="middle" fill="#a9b6c2">Gen4</text>
        <text x="296" y="118" text-anchor="middle" fill="#6f7f8d">idle</text>
      </g>
    </g>

    <!-- signal trace under the card -->
    <path d="M790 250 h60 l14 -22 l14 44 l14 -34 l14 12 h230" fill="none" stroke="#76b900" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
