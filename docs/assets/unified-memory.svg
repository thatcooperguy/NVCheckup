<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="How NVCheckup reads unified memory on a DGX Spark: one 128 GiB LPDDR5X pool, MemTotal 119.7 GiB visible to Linux, nvidia-smi memory fields [N/A] by design">
  <defs>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274016"/>
      <stop offset="1" stop-color="#1a2b10"/>
    </linearGradient>
    <linearGradient id="reserved" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3541"/>
      <stop offset="1" stop-color="#1f2933"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a242e"/>
      <stop offset="1" stop-color="#111920"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="300" rx="14" fill="#0d1218"/>
  <rect x="0.5" y="0.5" width="1099" height="299" rx="14" fill="none" stroke="#2c3a47"/>

  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#76b900" letter-spacing="1.5">UNIFIED MEMORY ON GB10</text>
    <text x="236" y="34" font-size="13" fill="#6f7f8d">one LPDDR5X pool shared by the CPU and the GPU over NVLink-C2C; there is no VRAM number to report</text>

    <!-- physical pool: 128 GiB LPDDR5X, 1052 px wide = 8.22 px per GiB -->
    <text x="24" y="66" font-size="11" fill="#6f7f8d">128 GB LPDDR5X (physically 128 GiB), 256-bit, 273 GB/s</text>
    <g transform="translate(24 74)">
      <!-- reserved for display / firmware: ~8.3 GiB on 2025 units -->
      <rect width="68" height="56" rx="8" fill="url(#reserved)" stroke="#2c3a47"/>
      <text x="34" y="26" font-size="10" fill="#a9b6c2" text-anchor="middle">reserved</text>
      <text x="34" y="42" font-size="10" fill="#6f7f8d" text-anchor="middle">~8.3 GiB</text>
      <!-- MemTotal 125,513,944 kB = 119.7 GiB -->
      <rect x="68" width="984" height="56" rx="8" fill="url(#pool)" stroke="#3d5a1f"/>
      <text x="84" y="24" font-size="13" font-weight="600" fill="#e6edf3">MemTotal 119.7 GiB</text>
      <text x="84" y="44" font-size="11" fill="#a9b6c2">125,513,944 kB from /proc/meminfo: the only pool size NVCheckup and llm-plan ever use ("128 GB" is never assumed)</text>
    </g>

    <!-- llm-plan budget inside MemTotal: Llama 3.1 8B BF16, agent 4 x 32K, vLLM (spec 7.5) -->
    <text x="92" y="156" font-size="11" fill="#6f7f8d">llm-plan budget for the spec's worked example (Llama 3.1 8B BF16, agent profile 4 x 32K, vLLM): W + KV + R + F = 51.0 GiB of 119.7 GiB, fits</text>
    <g transform="translate(92 164)" font-size="10" text-anchor="middle">
      <rect width="66" height="30" rx="6" fill="#2a3541" stroke="#2c3a47"/>
      <text x="33" y="19" fill="#e6edf3">F 8 GiB</text>
      <rect x="66" width="99" height="30" rx="6" fill="#33424f" stroke="#2c3a47"/>
      <text x="115" y="19" fill="#e6edf3">R 12 GiB</text>
      <rect x="165" width="123" height="30" rx="6" fill="#4a7a00" stroke="#3d5a1f"/>
      <text x="226" y="19" fill="#e6edf3">W 15.0 GiB</text>
      <rect x="288" width="132" height="30" rx="6" fill="#5e9600" stroke="#3d5a1f"/>
      <text x="354" y="19" fill="#0d1218" font-weight="600">KV 16.0 GiB</text>
      <rect x="420" width="564" height="30" rx="6" fill="none" stroke="#2c3a47" stroke-dasharray="4 4"/>
      <text x="702" y="19" fill="#6f7f8d">68.7 GiB headroom (MemAvailable is re-checked after the server has loaded)</text>
    </g>
    <text x="92" y="214" font-size="10" fill="#6f7f8d">F = OS floor (8 GiB headless DGX OS, 10 GiB with GNOME or on Windows)  ·  R = runtime reserve (vLLM 12, SGLang / TRT-LLM 10, llama.cpp / Ollama 3)  ·  W = weights  ·  KV = cache x context x concurrency</text>

    <!-- three callouts -->
    <g font-size="11">
      <g transform="translate(24 232)">
        <rect width="336" height="52" rx="10" fill="url(#box)" stroke="#2c3a47"/>
        <text x="14" y="21" fill="#febc2e" font-weight="700">nvidia-smi says</text>
        <text x="14" y="40" fill="#a9b6c2">memory.total [N/A], Memory-Usage "Not Supported": expected, not a fault</text>
      </g>
      <g transform="translate(382 232)">
        <rect width="336" height="52" rx="10" fill="url(#box)" stroke="#2c3a47"/>
        <text x="14" y="21" fill="#76b900" font-weight="700">NVCheckup reads</text>
        <text x="14" y="40" fill="#a9b6c2">MemAvailable + SwapFree (HugePages override), swap, PSI, OOM counts</text>
      </g>
      <g transform="translate(740 232)">
        <rect width="336" height="52" rx="10" fill="url(#box)" stroke="#2c3a47"/>
        <text x="14" y="21" fill="#e6edf3" font-weight="700">Suppressed on purpose</text>
        <text x="14" y="40" fill="#a9b6c2">low-vram, pcie-* (link misreports Gen1 x1), fan and power-limit rules</text>
      </g>
    </g>
  </g>
</svg>
